version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: bazaarbd_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - bazaarbd

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: bazaarbd_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      - mysql
      - redis
    networks:
      - bazaarbd

  mysql:
    image: mysql:8.0
    container_name: bazaarbd_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bazaarbd
      MYSQL_USER: bazaarbd_user
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - bazaarbd

  redis:
    image: redis:7-alpine
    container_name: bazaarbd_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - bazaarbd

  mailhog:
    image: mailhog/mailhog
    container_name: bazaarbd_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - bazaarbd

  frontend:
    image: node:20-alpine
    container_name: bazaarbd_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - php
    networks:
      - bazaarbd

  admin:
    image: node:20-alpine
    container_name: bazaarbd_admin
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./admin:/app
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - php
    networks:
      - bazaarbd

volumes:
  mysql_data:

networks:
  bazaarbd:
    driver: bridge
